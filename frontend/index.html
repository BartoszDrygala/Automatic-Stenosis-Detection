<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stenosis detection</title>
</head>
<body>
  <h1>Stenosis detection</h1>
  <p>Upload a vessel mask (PNG).</p>

  <input type="file" id="file" accept="image/png">
  <button id="run">Detect</button>
  <p id="status"></p>
  <img id="result" alt="" style="max-width: 100%">

  <script>
    const fileInput = document.getElementById("file");
    const button = document.getElementById("run");
    const statusEl = document.getElementById("status");
    const resultImg = document.getElementById("result");

    button.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) { statusEl.textContent = "Choose a PNG first."; return; }

      const form = new FormData();
      form.append("file", file);   // "file" must match the parameter name in routes.py

      statusEl.textContent = "Processing...";
      button.disabled = true;
      try {
        const response = await fetch("/api/v1/detections", { method: "POST", body: form });
        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail);
        }
        const blob = await response.blob();           // the PNG bytes
        resultImg.src = URL.createObjectURL(blob);    // show them
        statusEl.textContent = "Done.";
      } catch (e) {
        statusEl.textContent = "Error: " + e.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
